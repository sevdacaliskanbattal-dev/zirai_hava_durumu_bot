name: Günlük Zirai Hava Durumu Raporu

on:
  schedule:
    # Türkiye saatiyle her sabah 07:30'da çalışır (UTC 04:30)
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  send-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: pip install -r requirements.txt

      - name: Raporu Gönder
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
